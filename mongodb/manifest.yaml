apiVersion: apps/v1
kind: Deployment
metadata:
  name : mongodb
  namespace: roboshop
  lables:
    project: roboshop
    component: mongodb
    tier: db
spec:
  ReplicaSet: 1
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      tier: db
template:
  metadata:
    lables:
      project: roboshop
      component: mongodb
      tier: db
  spec:
    containers:
      name: momgodb
      image: rakesh2218/mongodb:v1
